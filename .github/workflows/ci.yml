name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy 2.5 가 >=3.12 를 요구해 실질 하한이 3.12 다.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 전처리기 설정을 매번 새로 받지 않도록 Hub 캐시를 재사용한다.
      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-vit-base-patch16-224

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

  # 배포 이미지는 torch 없이도 앱이 뜨는지 별도로 확인한다.
  # 이 조합이 깨지면 Streamlit Cloud 배포가 그대로 죽는다.
  deploy-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert torch is absent
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("torch") is None, "배포 의존성에 torch 가 섞였다"
          PY

      - name: Core imports without torch
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from vision_dashboard import backends
          statuses = {s.key: s for s in backends.all_statuses()}
          assert not statuses["pytorch_fp32"].available
          assert not statuses["pytorch_int8"].available
          print("torch 없는 환경 판정 정상")
          PY
